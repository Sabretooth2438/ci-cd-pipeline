name: CI/CD Pipeline

# Trigger only on push to main and release
on:
  push:
    branches:
      - main      # CI only
      - release   # CI/CD only

jobs:
  # 🔍 Job 1: Code Scanning (runs on both main and release)
  code-scan:
    name: Code Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=low || true

  # 🧪 Job 2: CI (runs only on main)
  ci:
    if: github.ref == 'refs/heads/main'
    name: CI (Build, Test, Publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Publish (Dummy)
        run: echo "Published to registry"

  # 🚀 Job 3: Full CI/CD (runs only on release)
  cicd:
    if: github.ref == 'refs/heads/release'
    name: Full CI/CD Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Publish (Dummy)
        run: echo "Published to registry"

      - name: Deploy (Dummy)
        run: echo "Deployed to production"
