name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - release

jobs:
  code-scan:
    name: Code Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=low || true

  ci:
    if: github.ref == 'refs/heads/main'
    name: CI (Build, Test, Publish)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Publish (Dummy)
        run: echo "Published to registry"

  cicd:
    if: github.ref == 'refs/heads/release'
    name: Full CI/CD Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Publish (Dummy)
        run: echo "Published to registry"

      - name: Deploy (Dummy)
        run: echo "Deployed to production"
